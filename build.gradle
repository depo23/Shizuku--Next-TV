plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "14.0.27"
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    // The commit count is part of the name so the in-app updater can tell two builds of the same
    // base version apart: it compares "14.0.27.r123" against a release tagged the same way.
    versionName = "${baseVersionName}.r${gitCommitCount}${if (isBeta) "-beta" else ""}-next"
}
